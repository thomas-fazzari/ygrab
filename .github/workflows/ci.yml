name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # A skipped job counts as passed, a skipped workflow leaves the required check pending
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [[ "$EVENT" != workflow_dispatch ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '(^|/)(README|AGENTS|ARCHITECTURE)\.md$|^docs/|^LICENSE$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only runs the AppHost, which is for local development
      MISE_DISABLE_TOOLS: aspire
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run install
      - run: mise run check

  # The only check that the master ruleset requires
  ci-ok:
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass or be skipped
        env:
          NEEDS: ${{ toJson(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
