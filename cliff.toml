# git-cliff turns the commits into web/src/changelog.json, through `mise run release`

[changelog]
body = ""

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "newest"
# A squash merge appends the pull request number to the title
commit_preprocessors = [{ pattern = '\s*\(#\d+\)$', replace = "" }]
commit_parsers = [
  { message = "^feat", group = "feat" },
  { message = "^fix", group = "fix" },
  { message = "^perf", group = "perf" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
